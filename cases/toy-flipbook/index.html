     perspective on .tb-device-zone, and transform-origin 50% 100% on the
     desk toys. The flipbook depends on all frames occupying the same box;
     the squash depends on the origin sitting at the contact point.
   SKIN (do not lift — lift the REASONING, see README §可以照搬/不许照搬):

:root{
  --cream:#f3efe8;
  --cream-deep:#e9e3d8;
  --ink:#17150f;
  --paper:#e7e2d6;
  --lilac:#dcc8ef;
  --mint:#cde6d4;
  --peach:#f5d2b8;
}

*{box-sizing:border-box;margin:0;padding:0}

html,body{width:100%;background:var(--cream)}
body{
  color:var(--ink);
  font-family:'Space Grotesk',-apple-system,BlinkMacSystemFont,sans-serif;
  font-size:14px;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

.tb-hero{
  position:relative;
  min-height:100vh;
  overflow:hidden;
  background:radial-gradient(120% 70% at 50% -10%, #fdfbf7 0%, var(--cream) 55%, var(--cream-deep) 100%);
  perspective:1200px;
}

/* ── background blob — deepest parallax layer ─────────────────────── */
.tb-blob{
  position:absolute;
  top:8%;left:22%;
  width:56%;aspect-ratio:1.1;
  background:radial-gradient(50% 50% at 50% 50%, var(--mint) 0%, rgba(205,230,212,0) 70%);
  z-index:1;
  pointer-events:none;
  will-change:transform;
}

/* ── nav ──────────────────────────────────────────────────────────── */
.tb-nav{
  position:absolute;
  inset:0 0 auto 0;
  z-index:8;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:26px 34px;
  animation:tb-fade-down 700ms cubic-bezier(.16,1,.3,1) both;
}
.tb-nav-logo{
  width:34px;height:34px;
  display:grid;place-items:center;
  background:var(--ink);
  color:var(--cream);
  border-radius:9px;
  font-weight:700;font-size:18px;
}
.tb-nav-links{display:flex;gap:30px;list-style:none}
.tb-nav-links a{
  color:var(--ink);
  text-decoration:none;
  font-size:11px;font-weight:700;letter-spacing:1.6px;
  padding:6px 10px;
  border-radius:999px;
  transition:background 180ms cubic-bezier(.34,1.56,.64,1),
             transform 180ms cubic-bezier(.34,1.56,.64,1);
}
.tb-nav-links a:hover{
  background:var(--ink);
  color:var(--cream);
  transform:rotate(-2deg) scale(1.06);
}
.tb-nav-hint{font-size:11px;letter-spacing:1px;opacity:.45}

/* ── desk toys ────────────────────────────────────────────────────── */
/* @mechanism — transform-origin at the contact point is what makes the
   hop squash from the tabletop instead of from the middle of the toy. */
.tb-desk-toy{
  position:absolute;
  z-index:2;
  pointer-events:none;
  transform-origin:50% 100%;
  will-change:transform;
  /* backwards: once the pop-in ends, the rAF physics takes the transform */
  animation:tb-pop 600ms cubic-bezier(.34,1.56,.64,1) backwards;
}
.tb-desk-toy img{
  width:100%;
  display:block;
  filter:drop-shadow(0 6px 8px rgba(23,21,15,.14));
}
.tb-desk-shadow{
  position:absolute;
  left:12%;bottom:-8px;
  width:76%;height:9px;
  border-radius:50%;
  background:radial-gradient(50% 50% at 50% 50%, rgba(23,21,15,.28), transparent 72%);
  filter:blur(2px);
}

/* ── device ───────────────────────────────────────────────────────── */
.tb-device-zone{
  position:absolute;
  top:46%;left:50%;
  transform:translate(-50%,-58%);
  z-index:3;
  width:min(340px,60vw);
  aspect-ratio:.78;
  /* Local perspective: strong foreshortening on the yaw swing */
  perspective:750px;
}
.tb-device{
  position:relative;
  width:100%;height:100%;
  transform-style:preserve-3d;
  will-change:transform;
  animation:tb-drop-in 900ms cubic-bezier(.34,1.56,.64,1) both;
  animation-delay:.15s;
}

/* @mechanism — every frame fills the same box and starts at opacity 0.
   The loop sets exactly one of them to 1. No transition on opacity: a
   crossfade here turns a flipbook back into a dissolve, which is the
   single thing that kills the stop-motion read. */
.tb-frame{
  position:absolute;
  inset:0;
  width:100%;height:100%;
  object-fit:contain;
  opacity:0;
  will-change:opacity;
  user-select:none;
  filter:drop-shadow(0 16px 24px rgba(23,21,15,.2));
}

.tb-device-shadow{
  position:absolute;
  left:12%;bottom:-14%;
  width:76%;height:7%;
  background:radial-gradient(50% 50% at 50% 50%, rgba(23,21,15,.55), transparent 70%);
  border-radius:50%;
  filter:blur(6px);
  opacity:.26;
  will-change:transform,opacity;
}

/* ── headline ─────────────────────────────────────────────────────── */
.tb-headline{
  position:absolute;
  top:56%;left:50%;
  transform:translateX(-50%);
  z-index:5;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:14px;
  width:max-content;
  max-width:94vw;
  font-weight:500;
}
.tb-line{
  display:flex;
  gap:14px;
  align-items:baseline;
  flex-wrap:wrap;
  justify-content:center;
}
.tb-word{
  display:inline-block;
  font-size:clamp(34px,5.6vw,64px);
  letter-spacing:-1px;
  padding:2px 20px;
  border-radius:14px;
  animation:tb-word-in 700ms cubic-bezier(.34,1.56,.64,1) both;
  transition:transform 220ms cubic-bezier(.34,1.56,.64,1);
  cursor:default;
}
.tb-word:hover{transform:rotate(-2.5deg) scale(1.07)}
.tb-word-plain{
  background:transparent;
  font-family:'Gochi Hand',cursive;
  font-size:clamp(28px,4.4vw,50px);
}
.tb-word-paper{background:var(--paper);box-shadow:0 2px 0 rgba(23,21,15,.08)}
.tb-word-lilac{background:var(--lilac);box-shadow:0 2px 0 rgba(23,21,15,.08)}

/* ── footer strip ─────────────────────────────────────────────────── */
.tb-foot{
  position:absolute;
  inset:auto 0 0 0;
  z-index:8;
  display:flex;
  justify-content:space-between;
  padding:20px 34px;
  font-size:10px;
  letter-spacing:1.4px;
  opacity:.55;
  animation:tb-fade-down 700ms cubic-bezier(.16,1,.3,1) both;
  animation-delay:1.2s;
}
.tb-foot-mark{
  background:#ffe94d;
  color:var(--ink);
  padding:2px 8px;
  border-radius:4px;
  opacity:1;
}

/* ── entrances ────────────────────────────────────────────────────── */
@keyframes tb-drop-in{
  from{opacity:0;transform:translateY(-60px) rotateZ(-6deg) scale(.92)}
  to{opacity:1;transform:translateY(0) rotateZ(0) scale(1)}
}
@keyframes tb-word-in{
  from{opacity:0;transform:translateY(34px) rotate(3deg) scale(.85)}
  to{opacity:1;transform:translateY(0) rotate(0) scale(1)}
}
@keyframes tb-pop{
  from{opacity:0;scale:0}
  to{opacity:1;scale:1}
}
@keyframes tb-fade-down{
  from{opacity:0;transform:translateY(-14px)}
  to{opacity:1;transform:translateY(0)}
}

@media (max-width:640px){
  .tb-nav-links{display:none}
  .tb-device-zone{width:66vw}
}

/* @mechanism — only the entrances are on a clock, so only they are cut.
   The turnaround itself waits for the pointer and is already still. */
@media (prefers-reduced-motion:reduce){
  .tb-device,.tb-word,.tb-desk-toy,.tb-nav,.tb-foot{
    animation-duration:.01ms !important;
  }
  .tb-word{transition:none}
}
</style>

<script>
'use strict';
/* ══════════════════════════════════════════════════════════════════════
   MECHANISM — lift this whole block verbatim.

   Stop-motion turnaround: pre-rendered yaw frames, hard-cut flipbook
   scrubbed by pointer X. Two things make it read as claymation rather
   than as an image swap:

     1. The cut is HARD. `Math.round` picks one frame, that one gets
        opacity 1, every other gets 0. A crossfade at this point makes it
        a dissolve and the whole illusion collapses.
     2. A jitter offset is re-rolled at 11 Hz and HELD in between, against
        a 60 fps render. Continuous noise reads as a vibration; a held,
        low-rate re-roll reads as a hand re-placing the object each frame.

   The scrub itself is a spring, so the flipbook has momentum and can
   overshoot past a frame and come back.
   ══════════════════════════════════════════════════════════════════════ */

// Curated subset: the sheet's mid frames are near-duplicates, so scrub only
// through frames with a real yaw step between them. Angled views only — the
// head-on frame breaks the illusion, so the turnaround swings between
// three-quarter poses and never faces flat.
const FRAME_SEQ = [0, 5, 6, 7];   // yaw ≈ -40°, +25°, +40°, +55°
const FRAME_COUNT = FRAME_SEQ.length;

const SCRUB_STIFFNESS = 55;
const SCRUB_DAMPING = 0.9;
const WHEEL_KICK = 2.6;
const JITTER_FPS = 11;            // stop-motion re-roll rate
const JITTER_POS = 2.4;           // px
const JITTER_ROT = 1.1;           // deg

// Desk toys: pieces sit on the tabletop around the console, each with a
// contact shadow. They lean with the turnaround and give a tiny hop with
// squash & stretch when the console is spun — studio desk, not a mobile.
const TOYS = [
  { id:'cartridge', x:12, y:72, size:92, depth:0.80, freq:1.7 },
  { id:'donut',     x:25, y:84, size:66, depth:1.15, freq:2.2 },
  { id:'star',      x:69, y:78, size:58, depth:0.60, freq:1.9 },
  { id:'heart',     x:80, y:86, size:72, depth:1.00, freq:1.5 },
  { id:'dice',      x:91, y:74, size:56, depth:0.70, freq:2.5 },
];

const HEADLINE = [
  [ { word:'The', tone:'plain' }, { word:'Unmistakably', tone:'paper' } ],
  [ { word:'Original®', tone:'paper' }, { word:'Design', tone:'paper' }, { word:'Studio', tone:'lilac' } ],
];

const stage = document.getElementById('stage');
const deviceEl = document.getElementById('device');
const shadowEl = document.getElementById('deviceShadow');
const blobEl = document.getElementById('blob');
const navEl = document.getElementById('navWrap');
const footEl = document.getElementById('foot');
const headlineEl = document.getElementById('headline');

// ── build the frame stack ───────────────────────────────────────────
const frames = FRAME_SEQ.map((fi, i) => {
  const img = document.createElement('img');
  img.className = 'tb-frame';
  img.src = `img/f${fi}.webp`;
  img.alt = i === 1 ? 'Handheld game console' : '';
  img.draggable = false;
  deviceEl.appendChild(img);
  return img;
});

// ── build the desk toys ─────────────────────────────────────────────
const floaters = TOYS.map((toy, i) => {
  const el = document.createElement('div');
  el.className = 'tb-desk-toy';
  el.style.left = `${toy.x}%`;
  el.style.top = `${toy.y}%`;
  el.style.width = `${toy.size}px`;
  el.style.animationDelay = `${1 + i * 0.13}s`;
  el.setAttribute('aria-hidden', 'true');

  const img = document.createElement('img');
  img.src = `img/${toy.id}.webp`;
  img.alt = '';
  img.draggable = false;

  const sh = document.createElement('span');
  sh.className = 'tb-desk-shadow';

  el.append(img, sh);
  stage.appendChild(el);
  return el;
});

// ── build the headline ──────────────────────────────────────────────
let wordIndex = 0;
const lines = HEADLINE.map((line) => {
  const lineEl = document.createElement('span');
  lineEl.className = 'tb-line';
  for (const { word, tone } of line){
    const w = document.createElement('span');
    w.className = `tb-word tb-word-${tone}`;
    w.style.animationDelay = `${(0.35 + wordIndex++ * 0.12).toFixed(2)}s`;
    w.textContent = word;
    lineEl.appendChild(w);
  }
  headlineEl.appendChild(lineEl);
  return lineEl;
});

// ── state ───────────────────────────────────────────────────────────
let target = { x:0, y:0 };
let pos = { x:0, y:0 };
let vel = { x:0, y:0 };
let scrub = { p:(FRAME_COUNT - 1) / 2, v:0 };
let jitter = { x:0, y:0, r:0, next:0 };
const hops = TOYS.map(() => ({ y:0, v:0 }));
let activeFrame = Math.round(scrub.p);

const start = performance.now();
let last = start;

function tick(now){
  const dt = Math.min((now - last) / 1000, 1/30);
  last = now;
  const t = (now - start) / 1000;

  vel.x += (target.x - pos.x) * 90 * dt;
  vel.y += (target.y - pos.y) * 90 * dt;
  vel.x *= 0.85;
  vel.y *= 0.85;
  pos.x += vel.x * dt;
  pos.y += vel.y * dt;
  const x = pos.x, y = pos.y;

  // scrub spring: mouse X sweeps the turnaround
  const targetP = (target.x + 0.5) * (FRAME_COUNT - 1);
  scrub.v += (targetP - scrub.p) * SCRUB_STIFFNESS * dt;
  scrub.v *= SCRUB_DAMPING;
  scrub.p += scrub.v * dt;
  const p = Math.max(0, Math.min(FRAME_COUNT - 1, scrub.p));
  const pv = scrub.v;
  const centered = p / (FRAME_COUNT - 1) - 0.5;

  // stop-motion jitter: re-roll at a low tick rate, hold in between
  if (now >= jitter.next){
    jitter.x = (Math.random() - 0.5) * 2 * JITTER_POS;
    jitter.y = (Math.random() - 0.5) * 2 * JITTER_POS;
    jitter.r = (Math.random() - 0.5) * 2 * JITTER_ROT;
    jitter.next = now + 1000 / JITTER_FPS;
  }
  const j = jitter;

  // hard cut to nearest frame — flipbook, no crossfade
  const active = Math.round(p);
  activeFrame = active;
  for (let i = 0; i < frames.length; i++){
    frames[i].style.opacity = i === active ? '1' : '0';
  }

  const bob = Math.sin(t * 0.9) * 7;
  deviceEl.style.transform =
    `translate(${centered*150 + x*24 + j.x}px, ${y*34 + bob + j.y}px) ` +
    `rotateZ(${centered*13 + pv*1.2 + j.r + Math.sin(t*0.6)*1.1}deg) ` +
    `scale(${1 + Math.abs(centered)*0.08})`;

  shadowEl.style.transform =
    `translateX(${-centered*80 + j.x*0.5}px) scaleX(${1 + Math.abs(centered)*0.28})`;
  shadowEl.style.opacity = `${0.28 - Math.abs(centered)*0.1}`;

  // desk toys: slide with parallax, hop when the console is spun fast
  for (let i = 0; i < floaters.length; i++){
    const el = floaters[i];
    const toy = TOYS[i];
    const s = hops[i];
    // a strong spin kicks each toy up; the spring lands it with a bounce
    if (Math.abs(pv) > 2.2 && s.y === 0 && Math.random() < 0.06){
      s.v = -120 - Math.random() * 60;
    }
    s.v += 900 * dt;                                  // gravity
    s.y += s.v * dt;
    // Landing. NOTE: the original wrote `s.v < -30` here, but s.v is POSITIVE
    // on the way down, so that branch never ran: every toy stopped dead on
    // contact and the bounce and squash the code says it has never happened.
    // Caught by --flipbook leg 4; see README §踩过的坑 #1.
    if (s.y > 0){
      s.y = 0;
      if (s.v > 30){ s.impact = Math.min(s.v * 0.0008, 0.12); s.v = -s.v * 0.35; }
      else { s.v = 0; }
    }
    // The impact decays over ~10 frames instead of lasting the single frame of
    // contact — a squash you cannot see is the same as no squash.
    s.impact = (s.impact || 0) * 0.88;
    const squash = s.y < 0 ? 1 : 1 - s.impact;
    el.style.transform =
      `translate(${(x*130 + centered*110) * toy.depth}px, ${s.y + y*26*toy.depth}px) ` +
      `rotate(${centered * toy.depth * 16 + Math.sin(t * toy.freq * 0.5 + i * 2.1) * 2.2}deg) ` +
      `scale(${2 - squash}, ${squash})`;
  }

  for (let i = 0; i < lines.length; i++){
    const depth = i === 0 ? -0.55 : 0.8;
    lines[i].style.transform =
      `translateX(${(centered*170 + x*30) * depth}px) ` +
      `rotateZ(${centered * 4.4 * depth}deg) skewX(${pv * -0.5 * depth}deg)`;
  }

  blobEl.style.transform =
    `translate(${-centered*260 - x*90}px, ${-y*50 + Math.sin(t*0.5)*12}px) ` +
    `rotate(${centered*-18}deg) scale(${1 + Math.abs(centered)*0.06})`;

  navEl.style.transform = `translateX(${centered*-34 - x*10}px)`;
  footEl.style.transform = `translateX(${centered*44 + x*12}px)`;

  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

// ── input ───────────────────────────────────────────────────────────
stage.addEventListener('mousemove', (e) => {
  const r = stage.getBoundingClientRect();
  target = {
    x: (e.clientX - r.left) / r.width - 0.5,
    y: (e.clientY - r.top) / r.height - 0.5,
  };
});

stage.addEventListener('mouseleave', () => { target = { x:0, y:0 }; });

stage.addEventListener('wheel', (e) => {
  const delta = Math.abs(e.deltaY) > Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
  scrub.v += Math.max(-9, Math.min(9, (delta / 100) * WHEEL_KICK));
}, { passive:true });

/* ── oracle surface ──────────────────────────────────────────────────
   READ-ONLY on purpose — there is no setter for the scrub. --flipbook
   sweeps a real pointer across the stage and reads the frame stack back
   out, because a probe that writes the scrub would never exercise the
   mousemove handler that actually drives it.                          */
window.__probe = {
  frameCount: () => frames.length,
  active:     () => activeFrame,
  // computed, not inline: a transition on opacity interpolates between
  // frames and the inline value jumps straight to the target, so an
  // inline read cannot tell a hard cut from a 250ms dissolve.
  opacities:  () => frames.map(f => parseFloat(getComputedStyle(f).opacity)),
  scrub:      () => scrub.p,
  scrubV:     () => scrub.v,
  jitter:     () => ({ x:jitter.x, y:jitter.y, r:jitter.r }),
  toyBoxes:   () => floaters.map(el => {
    const r = el.getBoundingClientRect();
    return { y: r.top, h: r.height };
  }),
  toyTransforms: () => floaters.map(el => el.style.transform),
  hops:       () => hops.map(h => h.y),        // < 0 means off the table
  hopVels:    () => hops.map(h => h.v),
  deviceTransform: () => deviceEl.style.transform,
  lineTransforms: () => lines.map(el => el.style.transform),
};
</script>
</body>
</html>
